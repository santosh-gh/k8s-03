trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: 'k8s-dev'
- name: namespace
  value: 'default'
- name: artifactName 
  value: 'manifests'

stages:

  - stage: Publish
    displayName: Publish Artifact
    jobs:
      - job: PublishArtifact
        displayName: Publish Artifact
        steps:          
          - task: PublishPipelineArtifact@1
            displayName: Publish Manifest
            inputs:
              artifactName: $(artifactName)
              path: $(artifactName)

  - stage: Deploy
    jobs:
    - deployment: DeployAKS
      displayName: Deploy AKS
      environment: $(environment)
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: $(artifactName)

              - script: |
                  echo "Workspace Directory: $(Pipeline.Workspace)"
                  ls -R "$(Pipeline.Workspace)"

              - task: AzureCLI@2
                displayName: Get AKS Credentials
                inputs:
                  azureSubscription: $(serviceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    echo "Getting AKS credentials..."
                    az aks get-credentials --name $(aksCluster) --resource-group $(aksResourceGroup) --overwrite-existing
                          
                    echo "Deploying to AKS..."
                    kubectl apply -f $(Pipeline.Workspace)/manifests/configmap.yml -n $(namespace)

                    echo "Deployment completed."

              # - task: Kubernetes@1
              #   displayName: 'kubectl apply'
              #   inputs:
              #     connectionType: 'Kubernetes Service Connection'
              #     kubernetesServiceEndpoint: $(aksServiceConnection)
              #     namespace: $(namespace)
              #     command: apply
              #     arguments: '-f ./manifests'
